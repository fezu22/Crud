services:
  - type: web
    name: crud
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ZEGO_APP_ID
        value: "1460432965"
      - key: ZEGO_SERVER_SECRET
        sync: false
